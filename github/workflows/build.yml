name: Build TITAN APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project
        run: python make_android_project.py

      - name: Build APK
        working-directory: android_build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android_build/app/build/outputs/apk/release/app-release.apk TITAN_PRO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TITAN_PRO_APK
          path: TITAN_PRO.apk

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TITAN PRO APK #${{ github.run_number }}
          files: TITAN_PRO.apk
